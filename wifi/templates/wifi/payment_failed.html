{% extends 'wifi/base.html' %}
{% load static %}
{% block title %}Payment Failed – MAC Technologies{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="wifi-card text-center py-5 animate-fade">
            <i class="bi bi-x-circle-fill display-1 text-danger"></i>
            <h2 class="fw-bold mt-3" style="color: var(--brand-blue);">Payment Failed</h2>
            <p class="lead text-muted">Your payment could not be completed.</p>
            <p class="text-secondary">Please check your mobile money balance and try again.</p>
            <a href="{% url 'wifi:packages' %}" class="btn btn-primary mt-3">
                <i class="bi bi-arrow-repeat me-2"></i> Try Again
            </a>
        </div>
    </div>
</div>

<style>
    .animate-fade {
        animation: fadeUp 0.6s ease forwards;
        opacity: 0;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
