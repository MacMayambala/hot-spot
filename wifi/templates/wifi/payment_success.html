{% extends 'wifi/base.html' %}
{% load static %}
{% block title %}Payment Successful – MAC Technologies{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="wifi-card text-center py-5 animate-fade">
            <i class="bi bi-check-circle-fill display-1 text-success"></i>
            <h2 class="fw-bold mt-3" style="color: var(--brand-blue);">Payment Successful!</h2>
            <p class="lead text-muted">Your internet package is now active.</p>
            <p class="text-secondary">You can now enjoy fast and reliable internet.</p>
            <a href="{% url 'wifi:dashboard' %}" class="btn btn-primary mt-3">
                <i class="bi bi-speedometer2 me-2"></i> Go to Dashboard
            </a>
        </div>
    </div>
</div>

<style>
    .animate-fade {
        animation: fadeUp 0.6s ease forwards;
        opacity: 0;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
