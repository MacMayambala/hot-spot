{% extends 'wifi/base.html' %}
{% load static %}
{% block title %}Remote Troubleshoot – MAC Technologies{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color: var(--brand-blue);"><i class="bi bi-tools me-2"></i>Remote Troubleshoot</h2>
</div>

<div class="wifi-card mb-4">
    <form method="post" action="{% url 'wifi:remote_troubleshoot' %}" id="troubleshoot-form">
        {% csrf_token %}
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="device_id" class="form-label fw-bold">Select Device</label>
                <select name="device_id" id="device_id" class="form-select" required>
                    <option value="">— Choose a device —</option>
                    {% for device in devices %}
                        <option value="{{ device.id }}" {% if selected_device == device.id %}selected{% endif %}>
                            {{ device.name }} ({{ device.branch.name }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Quick Actions</label>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-info btn-sm" id="test-connection">
                        <i class="bi bi-plug"></i> Test
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="refresh-info">
                        <i class="bi bi-arrow-repeat"></i> Info
                    </button>
                </div>
            </div>
            <div class="col-md-5">
                <label for="command" class="form-label fw-bold">RouterOS Command</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="command" name="command" placeholder="e.g. /ip/address/print" value="{{ command|default:'' }}">
                    <button type="submit" class="btn btn-primary" id="execute-btn">
                        <i class="bi bi-play"></i> Execute
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

<!-- Results area -->
<div id="result-area">
    {% if result %}
        <div class="wifi-card">
            <h5 class="fw-bold">Command Output</h5>
            <pre style="background: #f5f5f5; padding: 15px; border-radius: 8px; overflow: auto; max-height: 400px;">{{ result|pprint }}</pre>
        </div>
    {% endif %}

    <div id="system-info" class="wifi-card mt-3" style="display: none;">
        <h5 class="fw-bold">System Information</h5>
        <div id="info-content"></div>
    </div>

    <div id="connection-result" class="wifi-card mt-3" style="display: none;">
        <h5 class="fw-bold">Connection Test</h5>
        <div id="connection-content"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const deviceSelect = document.getElementById('device_id');
        const testBtn = document.getElementById('test-connection');
        const infoBtn = document.getElementById('refresh-info');
        const resultArea = document.getElementById('result-area');
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        function showMessage(containerId, message, isError = false) {
            const container = document.getElementById(containerId);
            container.style.display = 'block';
            const content = document.getElementById(containerId + '-content') || container.querySelector('div:last-child');
            if (content) {
                content.innerHTML = `<div class="alert ${isError ? 'alert-danger' : 'alert-success'}">${message}</div>`;
            }
        }

        function getDeviceId() {
            return deviceSelect.value;
        }

        function fetchDeviceInfo(action) {
            const deviceId = getDeviceId();
            if (!deviceId) {
                alert('Please select a device first.');
                return;
            }
            const url = action === 'test' ? '/wifi/admin/api/device-status/' + deviceId + '/' : '/wifi/admin/api/device-info/' + deviceId + '/';
            fetch(url, {
                headers: { 'X-CSRFToken': csrfToken }
            })
            .then(response => response.json())
            .then(data => {
                if (action === 'test') {
                    const content = document.getElementById('connection-content');
                    const container = document.getElementById('connection-result');
                    container.style.display = 'block';
                    if (data.reachable) {
                        content.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle"></i> Device is reachable.</div>';
                    } else {
                        content.innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Device is unreachable.</div>';
                    }
                } else { // info
                    const content = document.getElementById('info-content');
                    const container = document.getElementById('system-info');
                    container.style.display = 'block';
                    if (data.system_info) {
                        let html = '<table class="table table-sm">';
                        for (const [key, value] of Object.entries(data.system_info[0])) {
                            html += `<tr><td><strong>${key}</strong></td><td>${value}</td></tr>`;
                        }
                        html += '</table>';
                        content.innerHTML = html;
                    } else {
                        content.innerHTML = '<div class="alert alert-warning">No system info available.</div>';
                    }
                }
            })
            .catch(error => {
                alert('Request failed: ' + error);
            });
        }

        testBtn.addEventListener('click', function(e) {
            e.preventDefault();
            fetchDeviceInfo('test');
        });

        infoBtn.addEventListener('click', function(e) {
            e.preventDefault();
            fetchDeviceInfo('info');
        });

        // Preserve selected device after form submission
        const urlParams = new URLSearchParams(window.location.search);
        const deviceParam = urlParams.get('device');
        if (deviceParam) {
            deviceSelect.value = deviceParam;
        }
    });
</script>
{% endblock %}
