{% extends 'wifi/base.html' %}
{% load static %}
{% block title %}Delete Device – MAC Technologies{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color: var(--brand-blue);"><i class="bi bi-trash me-2"></i>Delete Device</h2>
    <a href="{% url 'wifi:admin_devices' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Devices
    </a>
</div>

<div class="wifi-card">
    <div class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>
        Are you sure you want to delete the device <strong>"{{ device.name }}"</strong>?
        <br><small>This action cannot be undone.</small>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i> Yes, delete
        </button>
        <a href="{% url 'wifi:admin_devices' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
