{% extends 'wifi/base.html' %}
{% load static %}
{% block title %}Edit Device – MAC Technologies{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color: var(--brand-blue);"><i class="bi bi-pencil me-2"></i>Edit Device</h2>
    <a href="{% url 'wifi:admin_devices' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Devices
    </a>
</div>

<!-- Sub-Navigation -->
{% include 'wifi/admin/_nav.html' %}

<div class="wifi-card">
    <form method="post">
        {% csrf_token %}
        <div class="row g-4">
            <!-- Branch Selection -->
            <div class="col-md-6">
                <label for="branch" class="form-label fw-bold">Branch *</label>
                <select class="form-select" id="branch" name="branch" required>
                    <option value="">— Select Branch —</option>
                    {% for branch in branches %}
                        <option value="{{ branch.id }}" {% if device.branch.id == branch.id %}selected{% endif %}>
                            {{ branch.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Device Name -->
            <div class="col-md-6">
                <label for="name" class="form-label fw-bold">Device Name *</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ device.name }}" required>
            </div>

            <!-- IP Address -->
            <div class="col-md-6">
                <label for="ip_address" class="form-label fw-bold">IP Address / Hostname *</label>
                <input type="text" class="form-control" id="ip_address" name="ip_address" value="{{ device.ip_address }}" required>
            </div>

            <!-- API Port -->
            <div class="col-md-3">
                <label for="api_port" class="form-label fw-bold">API Port</label>
                <input type="number" class="form-control" id="api_port" name="api_port" value="{{ device.api_port }}">
            </div>

            <!-- Use SSL -->
            <div class="col-md-3 d-flex align-items-center">
                <div class="form-check mt-4">
                    <input type="checkbox" class="form-check-input" id="use_ssl" name="use_ssl" {% if device.use_ssl %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="use_ssl">Use SSL</label>
                </div>
            </div>

            <!-- Username -->
            <div class="col-md-6">
                <label for="username" class="form-label fw-bold">API Username *</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ device.username }}" required>
            </div>

            <!-- Password (optional, leave empty to keep current) -->
            <div class="col-md-6">
                <label for="password" class="form-label fw-bold">API Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Leave empty to keep current password">
                <small class="text-muted">Enter only if you want to change the password.</small>
            </div>

            <!-- Active Status -->
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if device.is_active %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="is_active">Active</label>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-1"></i> Update Device
            </button>
            <a href="{% url 'wifi:admin_devices' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
